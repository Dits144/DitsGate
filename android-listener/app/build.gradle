plugins { id 'com.android.application' }

android {
    namespace 'id.ditsgate.listener'
    compileSdk 35
    defaultConfig {
        applicationId 'id.ditsgate.listener'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-local'
    }
    buildTypes {
        debug { manifestPlaceholders = [usesCleartext: 'true'] }
        release { manifestPlaceholders = [usesCleartext: 'false']; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
